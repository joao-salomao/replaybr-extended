<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>replaybr-extended</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>replaybr-extended</h1>
      <p>Junta as duas câmeras de cada lance num vídeo só.</p>
    </header>

    <main>
      <section id="selection">
        <div class="row">
          <label>
            Quadra
            <select id="field"></select>
          </label>
          <label id="slug-label" hidden>
            Slug
            <input id="slug" type="text" placeholder="ex: global-society" />
          </label>
        </div>
        <div class="row">
          <label>
            Data
            <input id="date" type="date" />
          </label>
          <label>
            Hora
            <select id="hour" disabled></select>
          </label>
        </div>
        <p id="selection-notice" class="notice" hidden></p>
      </section>

      <section id="plays" hidden>
        <div class="plays-header">
          <h2>Lances</h2>
          <label class="select-all">
            <input id="check-all" type="checkbox" checked />
            marcar todos
          </label>
        </div>
        <ul id="play-list"></ul>

        <div class="options">
          <label id="swap-label" hidden>
            <input id="swap" type="checkbox" />
            Inverter câmeras
          </label>
          <label>
            <input id="concat" type="checkbox" />
            Juntar num vídeo só
          </label>
        </div>

        <button id="generate" type="button">Gerar</button>
      </section>

      <section id="result" hidden>
        <h2>Resultado</h2>
        <p id="progress" class="progress" aria-live="polite"></p>
        <div id="actions" class="actions" hidden></div>
        <p id="expiration" class="notice" hidden></p>
        <ul id="failures" class="failures" hidden></ul>
        <div id="clips"></div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
