name: Verify
description: Sets up Bun, installs dependencies, typechecks, runs the unit tests and the e2e.

inputs:
  bun-version:
    description: Bun version to install. Pass the BUN_VERSION repository variable.
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - run: bun install --frozen-lockfile
      shell: bash

    - run: bun run typecheck
      shell: bash

    - run: bun test
      shell: bash

    - run: bunx playwright install --with-deps chromium
      shell: bash

    # Builds the extension and drives it in Chromium against fixtures.
    - run: bun run e2e
      shell: bash
