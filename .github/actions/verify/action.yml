name: Verify
description: Sets up Bun, installs dependencies, typechecks and runs the unit tests.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - run: bun install --frozen-lockfile
      shell: bash

    - run: bun run typecheck
      shell: bash

    - run: bun test
      shell: bash
