name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      # --frozen-lockfile fails the build if bun.lock disagrees with
      # package.json, instead of silently resolving something else.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # The suite is hermetic: it stubs fetch and never invokes ffmpeg,
      # so the runner needs nothing beyond Bun.
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Docker is preinstalled on the runner, so a plain build needs no action.
      - run: docker build -t replaybr-extended:ci .

      # Building only proves the Dockerfile parses. Booting proves the image
      # actually works — and it subsumes a separate ffmpeg check, because
      # server.ts verifies ffmpeg at startup and refuses to boot without it.
      - name: Boot the image and check it serves
        run: |
          docker run -d --name check -p 3000:3000 replaybr-extended:ci

          # Poll for readiness instead of sleeping a fixed amount: a fixed
          # sleep is either flaky or wasteful, and this fails loudly with the
          # container's own logs if the server never comes up.
          for attempt in $(seq 30); do
            # -s without -S: a poll that fails before the server is up is
            # expected, and its error would just be noise in the log.
            if curl -fs localhost:3000/api/fields >/dev/null \
               && curl -fs localhost:3000/ >/dev/null; then
              echo "API and page answered after ${attempt}s"
              docker logs check
              docker rm -f check
              exit 0
            fi
            sleep 1
          done

          echo "::error::the server did not answer within 30s"
          docker logs check
          docker rm -f check
          exit 1
