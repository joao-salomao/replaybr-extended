name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      # --frozen-lockfile fails the build if bun.lock disagrees with
      # package.json, instead of silently resolving something else.
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # The suite is hermetic: it stubs fetch and never invokes ffmpeg,
      # so the runner needs nothing beyond Bun.
      - run: bun test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Docker is preinstalled on the runner, so a plain build needs no action.
      - run: docker build -t replaybr-extended:ci .

      # Building proves the Dockerfile is valid; this proves the thing the
      # image exists for. The host is not expected to have ffmpeg, so if it
      # were missing here the server would refuse to boot in production.
      - name: Check ffmpeg and ffprobe are in the image
        run: docker run --rm replaybr-extended:ci sh -c "ffmpeg -version && ffprobe -version"
