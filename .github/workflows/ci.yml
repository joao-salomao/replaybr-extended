name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Shared by CI and Release: Bun, install, typecheck, unit tests, e2e.
      - uses: ./.github/actions/verify
        with:
          bun-version: ${{ vars.BUN_VERSION }}
