name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Shared by CI and Release: Bun, install, typecheck, unit tests.
      - uses: ./.github/actions/verify

      - run: bunx playwright install --with-deps chromium

      # Builds the extension and drives it in Chromium against fixtures.
      - run: bun run e2e
